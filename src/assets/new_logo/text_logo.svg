<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0063a6" />
      <stop offset="100%" stop-color="#00b0ab" />
    </linearGradient>
   
    <style>
      .text-dark {
        font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 72px;
        fill: #002c61;
      }
      .text-grad {
        font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 72px;
        fill: url(#textGradient);
      }
    </style>
  </defs>
 
  <text x="50" y="100" class="text-dark">aktionsbündnis</text>
 
  <text x="50" y="185" class="text-grad">erneuerbare</text>
  <text x="50" y="270" class="text-grad">energien</text>
 
  <rect x="50" y="290" width="520" height="6" fill="url(#textGradient)" rx="3"/>
</svg>