<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Aktionsbündnis erneuerbare energien Logo</title>
  <desc id="desc">Modernes typografisches Logo mit transparentem Hintergrund.</desc>
  <defs>
    <linearGradient id="energyGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00306f"/>
      <stop offset="48%" stop-color="#0077d9"/>
      <stop offset="100%" stop-color="#00c7a7"/>
    </linearGradient>
  </defs>

  <text x="70" y="155"
        font-family="Inter, Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="92" font-weight="800" letter-spacing="-3"
        fill="#00306f">Aktionsbündnis</text>

  <text x="70" y="265"
        font-family="Inter, Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="96" font-weight="800" letter-spacing="-3.5"
        fill="url(#energyGradient)">erneuerbare</text>

  <text x="70" y="365"
        font-family="Inter, Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="96" font-weight="800" letter-spacing="-3.5"
        fill="url(#energyGradient)">energien</text>

  <rect x="72" y="384" width="610" height="10" rx="5" fill="url(#energyGradient)" opacity="0.9"/>
</svg>
